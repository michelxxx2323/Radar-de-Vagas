<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Candidaturas</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --border: #dfe3e8;
    --text: #1d232b; --muted: #5f6b7a; --accent: #1f4e79; --accent-text: #ffffff;
    --enviada: #5b3fb0; --enviada-bg: #ece6fb; --entrevista: #0f766e; --entrevista-bg: #dcf3f0;
    --oferta: #1d7a35; --oferta-bg: #dff3e4; --recusada: #b42318; --recusada-bg: #fde7e5;
    --encerrada: #6b7280; --encerrada-bg: #eef0f2; --alerta: #b42318; --atraso: #b26a00;
    --nova: #1f4e79; --nova-bg: #e1ecf7;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --surface: #1a1f26; --surface-2: #222831; --border: #2e3640;
      --text: #e6e9ed; --muted: #9aa5b1; --accent: #5b9bd5; --accent-text: #0d1117;
      --enviada: #b3a1f0; --enviada-bg: #2b2346; --entrevista: #5fd0c2; --entrevista-bg: #143532;
      --oferta: #6fd68a; --oferta-bg: #173520; --recusada: #f2877d; --recusada-bg: #3d1d1a;
      --encerrada: #9aa5b1; --encerrada-bg: #262c34; --alerta: #f2877d; --atraso: #f0b44c; --shadow: none;
      --nova: #8cc0ef; --nova-bg: #1b2c3d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--border);
           background: var(--surface); color: var(--text); padding: 6px 12px; }
  button:hover { border-color: var(--accent); }
  button.primario { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.discreto { border-color: transparent; background: none; color: var(--muted); padding: 4px 8px; }
  button.discreto:hover { color: var(--alerta); border-color: var(--border); }
  button:disabled { opacity: .55; cursor: default; }
  input, select { font: inherit; color: var(--text); background: var(--surface);
                  border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }

  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
           padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .meta.atrasado { color: var(--atraso); }
  #sair { margin-left: auto; }

  nav { display: flex; gap: 4px; padding: 0 24px; background: var(--surface);
        border-bottom: 1px solid var(--border); overflow-x: auto; }
  nav button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none;
               padding: 12px 14px; color: var(--muted); white-space: nowrap; }
  nav button.ativa { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  nav .conta { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px;
               background: var(--surface-2); font-size: 12px; text-align: center; }

  main { padding: 20px 24px 60px; max-width: 1280px; margin: 0 auto; }
  .vazio { color: var(--muted); padding: 40px 0; text-align: center; }
  .barra { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .barra input[type=search] { min-width: 260px; flex: 1; max-width: 420px; }
  .sub { color: var(--muted); font-size: 13px; }
  .erro { color: var(--alerta); font-size: 13px; }

  .login { max-width: 340px; margin: 80px auto; display: flex; flex-direction: column; gap: 12px;
           background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; }
  .login h2 { margin: 0; font-size: 16px; }

  .cartao { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
            padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
  .cartao h3 { margin: 0; font-size: 15px; }
  .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .form-cand { margin-bottom: 16px; max-width: 880px; }
  .grade-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .grade-form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .grade-form .largo { grid-column: 1 / -1; }

  .tabela { width: 100%; border-collapse: collapse; background: var(--surface);
            border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .tabela th, .tabela td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left;
                           vertical-align: middle; }
  .tabela th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); }
  .tabela tr:last-child td { border-bottom: 0; }
  .tabela .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tabela td.vaga { min-width: 260px; }
  .tabela input.notas { width: 100%; min-width: 200px; }
  .rolagem { overflow-x: auto; }

  .nota { display: inline-block; min-width: 38px; text-align: center; font-weight: 600;
          font-variant-numeric: tabular-nums; border-radius: 6px; padding: 2px 6px; background: var(--surface-2); }
  .chip { display: inline-flex; align-items: center; font-size: 12px; border-radius: 10px;
          padding: 2px 8px; white-space: nowrap; }
  .s-enviada { background: var(--enviada-bg); color: var(--enviada); }
  .s-entrevista { background: var(--entrevista-bg); color: var(--entrevista); }
  .s-oferta { background: var(--oferta-bg); color: var(--oferta); }
  .s-recusada { background: var(--recusada-bg); color: var(--recusada); }
  .s-encerrada { background: var(--encerrada-bg); color: var(--encerrada); }
  .chip.nova { background: var(--nova-bg); color: var(--nova); font-weight: 600; margin-left: 6px; }

  .funil { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .funil button { display: flex; flex-direction: column; align-items: flex-start; min-width: 110px;
                  padding: 10px 14px; border-radius: 10px; }
  .funil button.ativa { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .funil .qtd { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .funil .rot { font-size: 12px; color: var(--muted); }

  .aviso { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text);
           color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 20; display: none; }
  .aviso.visivel { display: block; }

  @media (max-width: 700px) {
    header, nav, main { padding-left: 16px; padding-right: 16px; }
    .grade-form { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Painel de Candidaturas</h1>
  <span class="meta" id="meta"></span>
  <button id="sair" hidden>Sair</button>
</header>
<nav id="abas"></nav>
<main id="conteudo"></main>
<div class="aviso" id="aviso"></div>

<script>
const STATUS = { enviada: "Enviada", entrevista: "Entrevista", oferta: "Oferta", recusada: "Recusada", encerrada: "Encerrada" };
const ABAS = [{ id: "candidaturas", rotulo: "Candidaturas" }, { id: "vagas", rotulo: "Vagas de hoje" }];

let dados = { vagas: [], candidaturas: [], relatorio: "", pc_visto_em: "" };
// #vagas ou #candidaturas no endereço escolhe a aba
const hash = location.hash.slice(1);
let aba = ABAS.some(a => a.id === hash) ? hash : (lerLocal("aba") || "candidaturas");
if (!ABAS.some(a => a.id === aba)) aba = "candidaturas";
let filtroFunil = "ativas";
let filtroVagas = { busca: "", rec: "aplicar_agora", esconder: true, novas: false, limite: 150 };
// rascunho do formulário "+ Adicionar" (null = fechado); fica fora do HTML para
// a atualização automática da página não apagar o que foi digitado
let formCand = null;

function lerLocal(k) { try { return localStorage.getItem(k); } catch { return null; } }
function gravarLocal(k, v) { try { localStorage.setItem(k, v); } catch {} }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function nota(n) { const v = parseFloat(n); return isNaN(v) ? "–" : v.toFixed(1); }
function chipStatus(s) { return s ? `<span class="chip s-${esc(s)}">${esc(STATUS[s] || s)}</span>` : ""; }
function hojeISO() { return new Date().toLocaleDateString("sv-SE"); }  // AAAA-MM-DD no fuso local
// "2026-10-28" é uma data (sem fuso); "2026-10-28T03:15:00+00:00" é um instante
function dataBR(iso) {
  if (!iso) return "–";
  if (iso.length === 10) { const [a, m, d] = iso.split("-"); return `${d}/${m}/${a}`; }
  return new Date(iso).toLocaleDateString("pt-BR");
}
function diasDesde(iso) {
  if (!iso) return "";
  const d = Math.floor((Date.now() - new Date(iso.slice(0, 10) + "T00:00:00")) / 86400000);
  return d === 0 ? "hoje" : `${d} d`;
}
function haQuantoTempo(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 2) return "agora";
  if (min < 60) return `há ${min} min`;
  if (min < 48 * 60) return `há ${Math.round(min / 60)} h`;
  return `há ${Math.round(min / 1440)} dias`;
}
// "vagas_triadas_2026-10-28.csv" -> "2026-10-28"
function dataRelatorio() { return (dados.relatorio || "").replace("vagas_triadas_", "").replace(".csv", ""); }
// nova = apareceu no radar pela 1ª vez no dia do relatório
function ehNova(v) { return !!v.adicionada_em && v.adicionada_em === dataRelatorio(); }
function aviso(texto) {
  const el = document.getElementById("aviso");
  el.textContent = texto; el.classList.add("visivel");
  clearTimeout(aviso.t); aviso.t = setTimeout(() => el.classList.remove("visivel"), 2600);
}

async function api(caminho, corpo) {
  const r = await fetch(caminho, corpo === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo),
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && caminho !== "/api/login") { mostrarLogin(); throw new Error(j.erro || "Entre com a senha."); }
  if (!r.ok) throw new Error(j.erro || `erro ${r.status}`);
  return j;
}

// --- login ---------------------------------------------------------------------
function mostrarLogin() {
  clearTimeout(agendar.t);
  document.getElementById("abas").innerHTML = "";
  document.getElementById("sair").hidden = true;
  document.getElementById("conteudo").innerHTML = `<form class="login" id="login">
    <h2>Painel de Candidaturas</h2>
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
    <button class="primario">Entrar</button><span class="erro" id="login-erro"></span></form>`;
  document.getElementById("senha").focus();
}
document.getElementById("sair").addEventListener("click", async () => {
  await api("/api/sair", {}).catch(() => {});
  mostrarLogin();
});

// --- carregamento e atualização automática --------------------------------
async function carregar() {
  try { dados = await api("/api/painel"); }
  catch (e) { if (!document.getElementById("login")) aviso("Não consegui falar com o painel: " + e.message); return; }
  document.getElementById("sair").hidden = false;
  const meta = document.getElementById("meta");
  const data = dataRelatorio();
  meta.textContent = data ? `Vagas de ${dataBR(data)}` + (dados.pc_visto_em ? ` · PC sincronizou ${haQuantoTempo(dados.pc_visto_em)}` : "")
    : "O PC ainda não mandou as vagas";
  // a rodada é diária: mais de um dia e meio sem notícia do PC merece um aviso
  meta.classList.toggle("atrasado", !dados.pc_visto_em || Date.now() - new Date(dados.pc_visto_em) > 36 * 3600000);
  desenharAbas();
  // não redesenha embaixo de quem está digitando
  const foco = document.activeElement;
  if (!(foco && foco.closest("#conteudo") && ["INPUT", "SELECT"].includes(foco.tagName))) desenhar();
}
function agendar() {
  clearTimeout(agendar.t);
  agendar.t = setTimeout(async () => { await carregar(); agendar(); }, 60000);
}

const POS = Object.keys(STATUS);
function cand(status) { return dados.candidaturas.filter(c => status.includes(c.status)); }

function desenharAbas() {
  const contas = {
    candidaturas: cand(["enviada", "entrevista", "oferta"]).length,
    vagas: dados.vagas.filter(v => v.recomendacao === "aplicar_agora" && !v.status).length,
  };
  document.getElementById("abas").innerHTML = ABAS.map(a => `
    <button class="${a.id === aba ? "ativa" : ""}" data-aba="${a.id}">${a.rotulo}
      <span class="conta">${contas[a.id]}</span></button>`).join("");
}
document.getElementById("abas").addEventListener("click", e => {
  const b = e.target.closest("button[data-aba]"); if (!b) return;
  aba = b.dataset.aba; gravarLocal("aba", aba); desenharAbas(); desenhar();
});

function desenhar() {
  document.getElementById("conteudo").innerHTML = aba === "vagas" ? abaVagas() : abaCandidaturas();
}

// --- Candidaturas ------------------------------------------------------------
function formularioCandidatura() {
  if (!formCand) return `<div class="barra"><button class="primario" data-acao="nova-cand">+ Adicionar candidatura</button>
    <span class="sub">Para uma vaga de fora do relatório (LinkedIn, site da empresa…)</span></div>`;
  const campo = (nome, rotulo, tipo = "text", extra = "") => `<label>${rotulo}
    <input name="${nome}" type="${tipo}" value="${esc(formCand[nome] || "")}" ${extra}></label>`;
  return `<form class="cartao form-cand" id="form-cand">
    <h3>Adicionar candidatura</h3>
    <div class="grade-form">
      ${campo("titulo", "Vaga", "text", "required")}
      ${campo("empresa", "Empresa", "text", "required")}
      ${campo("link", "Link da vaga (opcional)", "url", 'placeholder="https://…"')}
      ${campo("enviada_em", "Enviada em", "date", "required")}
      <span class="largo">${campo("notas", "Anotações (opcional)")}</span>
    </div>
    <div class="acoes"><button class="primario">Salvar como enviada</button>
      <button type="button" data-acao="cancelar-cand">Cancelar</button></div></form>`;
}
function abaCandidaturas() {
  const todas = cand(POS);
  const contas = Object.fromEntries(POS.map(s => [s, todas.filter(c => c.status === s).length]));
  const ativas = todas.filter(c => ["enviada", "entrevista", "oferta"].includes(c.status));
  const botoes = [["ativas", "Em andamento", ativas.length], ...POS.map(s => [s, STATUS[s], contas[s]])];
  const lista = (filtroFunil === "ativas" ? ativas : todas.filter(c => c.status === filtroFunil))
    .sort((a, b) => (b.enviada_em || "").localeCompare(a.enviada_em || ""));
  const topo = formularioCandidatura() + `<div class="funil">${botoes.map(([id, rot, n]) => `
    <button class="${filtroFunil === id ? "ativa" : ""}" data-acao="funil" data-filtro="${id}">
      <span class="qtd">${n}</span><span class="rot">${esc(rot)}</span></button>`).join("")}</div>`;
  if (!todas.length) return topo + `<div class="vazio">Nenhuma candidatura ainda. Use “Já enviei” numa vaga de hoje
    ou “+ Adicionar candidatura” para uma vaga de fora do relatório.</div>`;
  if (!lista.length) return topo + `<div class="vazio">Nenhuma candidatura neste filtro.</div>`;
  return topo + `<div class="rolagem"><table class="tabela"><thead><tr>
    <th>Vaga</th><th>Status</th><th>Enviada em</th><th class="num">Há</th><th>Anotações</th><th></th></tr></thead><tbody>
    ${lista.map(c => `<tr>
      <td class="vaga">${/^https?:/.test(c.link) ? `<a href="${esc(c.link)}" target="_blank" rel="noopener"><strong>${esc(c.titulo)}</strong></a>`
          : `<strong>${esc(c.titulo)}</strong>`}
        <div class="sub">${esc(c.empresa)}${c.fonte === "manual" ? " · adicionada à mão" : ""}</div></td>
      <td><select data-acao="status" data-id="${c.id}">${POS.map(s =>
        `<option value="${s}" ${s === c.status ? "selected" : ""}>${STATUS[s]}</option>`).join("")}</select></td>
      <td>${dataBR(c.enviada_em)}</td>
      <td class="num sub">${diasDesde(c.enviada_em)}</td>
      <td><input class="notas" data-acao="notas" data-id="${c.id}" value="${esc(c.notas)}" placeholder="ex.: recrutadora Ana, retorno sexta"></td>
      <td class="num"><button class="discreto" data-acao="excluir" data-id="${c.id}" title="Excluir este registro">Excluir</button></td>
    </tr>`).join("")}</tbody></table></div>`;
}

// --- Vagas de hoje -------------------------------------------------------------
function abaVagas() {
  const f = filtroVagas;
  const busca = f.busca.toLowerCase();
  const lista = dados.vagas.filter(v =>
    (f.rec === "todas" || v.recomendacao === f.rec) &&
    (!f.esconder || !v.status) &&
    (!f.novas || ehNova(v)) &&
    (!busca || `${v.titulo} ${v.empresa}`.toLowerCase().includes(busca)));
  const novas = lista.filter(ehNova).length;
  const barra = `<div class="barra">
    <input type="search" id="busca" placeholder="Buscar por vaga ou empresa" value="${esc(f.busca)}">
    <select id="rec">
      <option value="aplicar_agora" ${f.rec === "aplicar_agora" ? "selected" : ""}>Aplicar agora</option>
      <option value="avaliar" ${f.rec === "avaliar" ? "selected" : ""}>Avaliar</option>
      <option value="todas" ${f.rec === "todas" ? "selected" : ""}>As duas</option>
    </select>
    <label class="sub"><input type="checkbox" id="esconder" ${f.esconder ? "checked" : ""}> Esconder as que já enviei</label>
    <label class="sub"><input type="checkbox" id="novas" ${f.novas ? "checked" : ""}> Só as novas</label>
    <span class="sub">${lista.length} vaga(s)${novas ? ` · ${novas} nova(s)` : ""}</span></div>`;
  if (!dados.vagas.length) return barra + `<div class="vazio">As vagas do dia chegam quando o PC roda a coleta diária.</div>`;
  if (!lista.length) return barra + `<div class="vazio">Nenhuma vaga com esse filtro.</div>`;
  const linhas = lista.slice(0, f.limite).map(v => `<tr>
      <td class="num"><span class="nota">${nota(v.nota_fit)}</span></td>
      <td class="vaga"><a href="${esc(v.link)}" target="_blank" rel="noopener">${esc(v.titulo)}</a>${ehNova(v) ? `<span class="chip nova">Nova</span>` : ""}
        <div class="sub">${esc(v.empresa)}${v.salario ? " · " + esc(v.salario) : ""}</div></td>
      <td class="sub" title="Dia em que a vaga apareceu no radar pela 1ª vez">${dataBR(v.adicionada_em)}</td>
      <td class="sub">${esc(v.fonte)}</td>
      <td class="sub">${esc(v.cidade || (v.remoto === "True" ? "Remoto" : ""))}</td>
      <td class="num">${v.status ? chipStatus(v.status)
        : `<button class="primario" data-acao="ja-enviei" data-link="${esc(v.link)}">Já enviei</button>`}</td></tr>`).join("");
  const mais = lista.length > f.limite ? `<div class="barra" style="justify-content:center;margin-top:12px">
    <button data-acao="mais">Mostrar mais (${lista.length - f.limite})</button></div>` : "";
  return barra + `<div class="rolagem"><table class="tabela"><thead><tr><th class="num">Nota</th><th>Vaga</th>
    <th>Adicionada em</th><th>Fonte</th><th>Local</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div>` + mais;
}

// --- ações ---------------------------------------------------------------------
const conteudo = document.getElementById("conteudo");
conteudo.addEventListener("click", async e => {
  const b = e.target.closest("[data-acao]"); if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
  const { acao, id } = b.dataset;
  try {
    if (acao === "funil") { filtroFunil = b.dataset.filtro; desenhar(); return; }
    if (acao === "mais") { filtroVagas.limite += 150; desenhar(); return; }
    if (acao === "nova-cand") {
      formCand = { enviada_em: hojeISO() }; desenhar();
      document.querySelector('#form-cand [name="titulo"]').focus(); return;
    }
    if (acao === "cancelar-cand") { formCand = null; desenhar(); return; }
    if (acao === "ja-enviei") {
      b.disabled = true;
      await api("/api/candidatura", dados.vagas.find(x => x.link === b.dataset.link));
      aviso("Marcada como enviada — está na aba Candidaturas.");
    } else if (acao === "excluir") {
      const c = dados.candidaturas.find(x => x.id === id);
      if (!confirm(`Excluir o registro de “${c.titulo}” (${c.empresa})?`)) return;
      await api("/api/excluir", { id }); aviso("Registro excluído.");
    }
    await carregar();
  } catch (err) { aviso(err.message); b.disabled = false; }
});
conteudo.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "rec") { filtroVagas.rec = el.value; filtroVagas.limite = 150; desenhar(); return; }
  if (el.id === "esconder") { filtroVagas.esconder = el.checked; desenhar(); return; }
  if (el.id === "novas") { filtroVagas.novas = el.checked; filtroVagas.limite = 150; desenhar(); return; }
  try {
    if (el.dataset.acao === "status") { await api("/api/status", { id: el.dataset.id, status: el.value }); aviso("Status atualizado."); }
    else if (el.dataset.acao === "notas") { await api("/api/notas", { id: el.dataset.id, notas: el.value }); aviso("Anotação salva."); }
    else return;
    el.blur(); await carregar();
  } catch (err) { aviso(err.message); }
});
conteudo.addEventListener("input", e => {
  if (formCand && e.target.closest("#form-cand")) { formCand[e.target.name] = e.target.value; return; }
  if (e.target.id !== "busca") return;
  filtroVagas.busca = e.target.value; filtroVagas.limite = 150;
  const pos = e.target.selectionStart;
  desenhar();
  const novo = document.getElementById("busca"); novo.focus(); novo.setSelectionRange(pos, pos);
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "form-cand") {
    try {
      await api("/api/candidatura", formCand);
      formCand = null; filtroFunil = "ativas";
      aviso("Candidatura adicionada.");
      await carregar();
    } catch (err) { aviso(err.message); }
  } else if (e.target.id === "login") {
    try {
      await api("/api/login", { senha: document.getElementById("senha").value });
      await carregar(); agendar();
    } catch (err) { document.getElementById("login-erro").textContent = err.message; }
  }
});

carregar().then(agendar);
</script>
</body>
</html>

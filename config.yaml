  # Mesma lógica do Greenhouse: a InHire é um ATS por empresa
  # (<empresa>.inhire.app/vagas), sem busca entre empresas. "tenant" é o
  # subdomínio da empresa. Todas as vagas abertas de cada tenant entram
  # (sem filtro de termo, já que o volume por empresa costuma ser pequeno).
  inhire:
    enabled: true
    tenants:
      - "vr"
      - "housi"
      - "cerc"
      - "cobli"
      - "mottu"
      - "cielo"                  # 30/09/2026 via /radar — Cielo: "Analista de Performance Comercial Sênior",
                                  # "Analista Sênior de Estratégia e Ofertas (CRM)"
      # -- adicionadas em 21/09/2026, rodada de scale-ups/startups --
      - "nuvemshop-tiendanube"   # Nuvemshop/Tiendanube (e-commerce)
      - "unico"                  # unico (verificação de identidade)
      - "solfacil"               # Solfácil (fintech de energia solar)
      - "sanar"                  # Sanar (edtech de medicina) — tenant não 100% confirmado, se vier vazio pode não ser esse
      # -- adicionadas em 21/09/2026, rodada de marcas D2C (ver nota abaixo) --
      - "insiderstore"           # Insider Store (moda multimarcas) — também está na Gupy,
                                  # mas aqui traz TODAS as vagas, sem depender de bater com search_terms
      - "sallve"                 # Sallve (skincare D2C)

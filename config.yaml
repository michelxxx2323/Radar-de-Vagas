                              # Manager, Executive Assistant Sales), não puramente comerciais — vale monitorar
      # -- adicionada em 22/09/2026, a pedido do Michel ("bolt.new") --
      - "stackblitz"         # StackBlitz / Bolt.new (EUA, ferramenta de codificação com IA) — 10 vagas remotas,

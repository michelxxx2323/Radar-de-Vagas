  # Nota sobre marcas D2C (moda, cosméticos, e-commerce): pedido separadamente
  # por Michel em 21/09/2026, em duas rodadas (marcas grandes/tradicionais,
  # depois marcas D2C menores/mais novas). A maioria das marcas D2C/varejo
  # grandes já usa Gupy — Amaro, Farm Rio e Reserva (grupo AZZAS 2154/Grupo
  # Soma), Track&Field, Grendene/Melissa, Alpargatas/Havaianas, O Boticário,
  # Enjoei, Elo7, Dafiti, Netshoes/Centauro (Grupo SBF), Wine.com.br, GPA e
  # Via Varejo/Casas Bahia. Como a busca da Gupy já é entre TODAS as empresas
  # da plataforma (não só as listadas aqui), essas marcas JÁ aparecem
  # automaticamente nas buscas por e-commerce/marketplace/growth — não
  # precisam de entrada própria em greenhouse.boards/inhire.tenants.
  #
  # Já as marcas D2C menores/mais novas (a maioria fundada ou popularizada
  # nos últimos anos, sem o porte de uma Natura ou Boticário) tendem a usar
  # InHire em vez de Gupy — Insider Store, Sallve e Boca Rosa Company foram
  # confirmadas assim e entraram em inhire.tenants. Bruna Tavares/BT, WEPINK,
  # Puravida, Chilli Beans e Growth Supplements não tiveram nenhuma
  # plataforma identificável nas buscas — ficaram de fora por falta de
  # confirmação, não por decisão (pode valer conferir de novo mais pra
  # frente, ou Michel pode confirmar a plataforma se souber).
  #
  # Além do inhire.tenants, a mudança real desta rodada foi adicionar
  # "marketplace" aos search_terms (acima), que beneficia todas as fontes
  # por palavra-chave. Magazine Luiza/Época Cosméticos e Natura usam
  # plataformas próprias/fechadas — não dá pra cobrir automaticamente.

# Quantas vagas buscar por termo, por fonte (nas fontes que aceitam limite).
limit_per_term: 15

# Modelo do Jev a usar.
jev_model: "jev-latest"

# Quantas vagas vão pro Jev ao mesmo tempo. Era 1 (sequencial, ~2 h pra
# repontuar tudo). 15/10/2026: testado com 50 e com 100 vagas simultâneas —
# 0 falhas, ~1 s por lote. 15/10/2026: subindo pra 400 (a confirmar na
# próxima rodada). Se aparecerem muitas "falhas ao pontuar", baixe.
jev_workers: 400

# Aviso de vagas NOVAS (que nunca apareceram antes) — ver novidades.py.
# 26/10/2026: só "aplicar_agora", qualquer nota. O destino (e-mail via ntfy)
# fica no .env (NTFY_TOPIC / NTFY_EMAIL), fora do git.
avisos:
  recomendacoes: [aplicar_agora]
  nota_minima: 0

# Quantas buscas da coleta rodam ao mesmo tempo (no total). Por site, o limite
# é menor (4; beBee 2) — ver _SIMULTANEAS_POR_FONTE no screen.py.
collect_workers: 16

# Nota mínima (0-10) para a vaga entrar no relatório final. Use 0 para ver tudo.
min_score: 0

# Onde salvar o relatório (CSV). A data é adicionada automaticamente ao nome.
output_dir: "output"

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Candidaturas</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --border: #dfe3e8;
    --text: #1d232b; --muted: #5f6b7a; --accent: #1f4e79; --accent-text: #ffffff;
    --enviada: #5b3fb0; --enviada-bg: #ece6fb; --entrevista: #0f766e; --entrevista-bg: #dcf3f0;
    --oferta: #1d7a35; --oferta-bg: #dff3e4; --recusada: #b42318; --recusada-bg: #fde7e5;
    --encerrada: #6b7280; --encerrada-bg: #eef0f2; --alerta: #b42318; --atraso: #b26a00;
    --nova: #1f4e79; --nova-bg: #e1ecf7;
    --p1: #0b6e4f; --p1-bg: #dcf1e8; --p2: #a14a00; --p2-bg: #fbe9d7;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --surface: #1a1f26; --surface-2: #222831; --border: #2e3640;
      --text: #e6e9ed; --muted: #9aa5b1; --accent: #5b9bd5; --accent-text: #0d1117;
      --enviada: #b3a1f0; --enviada-bg: #2b2346; --entrevista: #5fd0c2; --entrevista-bg: #143532;
      --oferta: #6fd68a; --oferta-bg: #173520; --recusada: #f2877d; --recusada-bg: #3d1d1a;
      --encerrada: #9aa5b1; --encerrada-bg: #262c34; --alerta: #f2877d; --atraso: #f0b44c; --shadow: none;
      --nova: #8cc0ef; --nova-bg: #1b2c3d;
      --p1: #5fd3a5; --p1-bg: #133528; --p2: #f3a35c; --p2-bg: #3a2614;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--border);
           background: var(--surface); color: var(--text); padding: 6px 12px; }
  button:hover { border-color: var(--accent); }
  button.primario { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.discreto { border-color: transparent; background: none; color: var(--muted); padding: 4px 8px; }
  button.discreto:hover { color: var(--alerta); border-color: var(--border); }
  button.discreto.link, button.discreto.link:hover { color: var(--accent); border-color: transparent; }
  button:disabled { opacity: .55; cursor: default; }
  input, select { font: inherit; color: var(--text); background: var(--surface);
                  border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }

  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
           padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .meta.atrasado { color: var(--atraso); }
  #sair { margin-left: auto; }

  nav { display: flex; gap: 4px; padding: 0 24px; background: var(--surface);
        border-bottom: 1px solid var(--border); overflow-x: auto; }
  nav button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none;
               padding: 12px 14px; color: var(--muted); white-space: nowrap; }
  nav button.ativa { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  nav .conta { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px;
               background: var(--surface-2); font-size: 12px; text-align: center; }

  main { padding: 20px 24px 60px; max-width: 1280px; margin: 0 auto; }
  .vazio { color: var(--muted); padding: 40px 0; text-align: center; }
  .barra { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .barra input[type=search] { min-width: 260px; flex: 1; max-width: 420px; }
  .sub { color: var(--muted); font-size: 13px; }
  .erro { color: var(--alerta); font-size: 13px; }

  .login { max-width: 340px; margin: 80px auto; display: flex; flex-direction: column; gap: 12px;
           background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; }
  .login h2 { margin: 0; font-size: 16px; }

  .cartao { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
            padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
  .cartao h3 { margin: 0; font-size: 15px; }
  .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .form-cand { margin-bottom: 16px; max-width: 880px; }
  .grade-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .grade-form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .grade-form .largo { grid-column: 1 / -1; }

  .tabela { width: 100%; border-collapse: collapse; background: var(--surface);
            border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .tabela th, .tabela td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left;
                           vertical-align: middle; }
  .tabela th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); }
  .tabela tr:last-child td { border-bottom: 0; }
  .tabela .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tabela td.vaga { min-width: 260px; }
  .tabela input.notas { width: 100%; min-width: 200px; }
  .rolagem { overflow-x: auto; }

  .nota { display: inline-block; min-width: 38px; text-align: center; font-weight: 600;
          font-variant-numeric: tabular-nums; border-radius: 6px; padding: 2px 6px; background: var(--surface-2); }
  .chip { display: inline-flex; align-items: center; font-size: 12px; border-radius: 10px;
          padding: 2px 8px; white-space: nowrap; }
  .s-enviada { background: var(--enviada-bg); color: var(--enviada); }
  .s-entrevista { background: var(--entrevista-bg); color: var(--entrevista); }
  .s-oferta { background: var(--oferta-bg); color: var(--oferta); }
  .s-recusada { background: var(--recusada-bg); color: var(--recusada); }
  .s-encerrada { background: var(--encerrada-bg); color: var(--encerrada); }
  .chip.nova { background: var(--nova-bg); color: var(--nova); font-weight: 600; margin-left: 6px; }
  .chip.atraso { background: var(--surface-2); color: var(--atraso); font-weight: 600; margin-left: 6px; }
  .chip.alerta { background: var(--recusada-bg); color: var(--alerta); font-weight: 600; margin-left: 6px; cursor: help; }
  .rascunho td { background: var(--surface-2); }
  /* Perfil 1 (Brasil) e Perfil 2 (internacional, em dólar): cor própria em chip, linha e cartão */
  .chip.p-br { background: var(--p1-bg); color: var(--p1); font-weight: 600; }
  .chip.p-intl { background: var(--p2-bg); color: var(--p2); font-weight: 600; }
  .chip.p-br.mini, .chip.p-intl.mini { margin-left: 6px; font-size: 11px; padding: 1px 6px; }
  .tabela tr.perfil-br > td:first-child { box-shadow: inset 3px 0 0 var(--p1); }
  .tabela tr.perfil-intl > td:first-child { box-shadow: inset 3px 0 0 var(--p2); }
  .perfis { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .perfis button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
                   min-width: 200px; flex: 1; max-width: 340px; padding: 10px 14px; border-radius: 10px;
                   border-top: 4px solid var(--border); }
  .perfis button.br { border-top-color: var(--p1); }
  .perfis button.intl { border-top-color: var(--p2); }
  .perfis button.ativa { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .perfis button.br.ativa { border-color: var(--p1); box-shadow: inset 0 0 0 1px var(--p1); }
  .perfis button.intl.ativa { border-color: var(--p2); box-shadow: inset 0 0 0 1px var(--p2); }
  .perfis .nome { font-weight: 700; }
  .perfis .qtd { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .barra-pct { display: inline-block; height: 8px; border-radius: 4px; background: var(--accent); vertical-align: middle; margin-right: 8px; }
  .barra-pct.gap { background: var(--atraso); }
  .barra-pct.semgap { background: var(--muted); opacity: .6; }
  .duas { display: grid; grid-template-columns: 38px 1fr; gap: 2px 6px; align-items: center; font-size: 12px; min-width: 250px; white-space: nowrap; }
  .tabela td.cv { max-width: 320px; }
  .resumo-lacunas { margin: 0 0 14px; max-width: 880px; }
  .rascunho textarea { width: 100%; min-height: 130px; font: inherit; color: var(--text); background: var(--surface);
                       border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; resize: vertical; }
  .rascunho .acoes { margin-top: 8px; align-items: center; }

  .funil { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .funil button { display: flex; flex-direction: column; align-items: flex-start; min-width: 110px;
                  padding: 10px 14px; border-radius: 10px; }
  .funil button.ativa { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .funil .qtd { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .funil .rot { font-size: 12px; color: var(--muted); }

  .aviso { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text);
           color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 20; display: none; }
  .aviso.visivel { display: block; }

  @media (max-width: 700px) {
    header, nav, main { padding-left: 16px; padding-right: 16px; }
    .grade-form { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Painel de Candidaturas</h1>
  <span class="meta" id="meta"></span>
  <button id="sair" hidden>Sair</button>
</header>
<nav id="abas"></nav>
<main id="conteudo"></main>
<div class="aviso" id="aviso"></div>

<script>
const STATUS = { enviada: "Enviada", entrevista: "Entrevista", oferta: "Oferta", recusada: "Recusada", encerrada: "Encerrada" };
const ABAS = [{ id: "candidaturas", rotulo: "Candidaturas" }, { id: "vagas", rotulo: "Vagas de hoje" },
              { id: "lacunas", rotulo: "Lacunas" }];

let dados = { vagas: [], candidaturas: [], relatorio: "", pc_visto_em: "", lacunas: {}, lacunas_revisao: {},
              descartes: [], motivos_descarte: [] };
let filtroLacunas = { ver: "provaveis" };
// linha aberta na aba Lacunas: { termo, modo: "tenho" | "exemplos", nota }
let lacunaAberta = null;
// descarte aberto na aba Vagas de hoje: { link, motivo, nota }
let descarte = null;
// termo bem mais citado nas vagas com gap crítico do que nas sem (mesmo corte do lacunas.py)
const DIF_SUSPEITO = 8;
// #vagas ou #candidaturas no endereço escolhe a aba
const hash = location.hash.slice(1);
let aba = ABAS.some(a => a.id === hash) ? hash : (lerLocal("aba") || "candidaturas");
if (!ABAS.some(a => a.id === aba)) aba = "candidaturas";
let filtroFunil = "ativas";
let filtroVagas = { busca: "", rec: "aplicar_agora", perfil: lerLocal("perfil") || "todos", esconder: true, novas: false, descartadas: false, limite: 150 };
// Perfil 2 (07/11/2026): vagas internacionais em dólar, do relatório vagas_intl_*
const PERFIS = { br: "Brasil", intl: "Internacional" };
// rótulo curto do chip e o que cada perfil busca (cartões no topo da aba Vagas de hoje)
const PERFIL_CHIP = { br: "P1 · Brasil", intl: "P2 · Internacional" };
const PERFIL_DESC = { br: "Vagas no Brasil", intl: "Remotas no exterior, em dólar" };
const ELEGIB = { sim: "aceita Brasil", incerta: "elegibilidade incerta", nao: "não aceita Brasil" };
const TIPO_EMPRESA = { agencia: "agência", marca_dtc: "marca DTC", empresa_pequena: "empresa pequena",
  empresa_media: "empresa média", marketplace: "marketplace", saas: "SaaS", grande_corporacao: "grande corporação" };
const INGLES = { basico: "inglês básico", intermediario: "inglês intermediário", avancado: "inglês avançado", nativo: "inglês nativo" };
// rascunho do formulário "+ Adicionar" (null = fechado); fica fora do HTML para
// a atualização automática da página não apagar o que foi digitado
let formCand = null;
// rascunho de follow-up aberto: { id, idioma, texto } (null = fechado)
let rascunho = null;

// Follow-up (ideia do /outcome followup do ai-job-search, 06/11/2026): 10 dias
// sem resposta desde o envio ou o último follow-up pede um follow-up, no máximo
// dois por candidatura; 60 dias de silêncio sugerem encerrar.
const FOLLOWUP_DIAS = 10, PARADA_DIAS = 60, MAX_FOLLOWUPS = 2;
// vaga publicada há mais disso ganha aviso (o mesmo limite do screen.py)
const DIAS_VAGA_ANTIGA = 30;

function lerLocal(k) { try { return localStorage.getItem(k); } catch { return null; } }
function gravarLocal(k, v) { try { localStorage.setItem(k, v); } catch {} }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function nota(n) { const v = parseFloat(n); return isNaN(v) ? "–" : v.toFixed(1); }
function chipStatus(s) { return s ? `<span class="chip s-${esc(s)}">${esc(STATUS[s] || s)}</span>` : ""; }
function hojeISO() { return new Date().toLocaleDateString("sv-SE"); }  // AAAA-MM-DD no fuso local
// "2026-10-28" é uma data (sem fuso); "2026-10-28T03:15:00+00:00" é um instante
function dataBR(iso) {
  if (!iso) return "–";
  if (iso.length === 10) { const [a, m, d] = iso.split("-"); return `${d}/${m}/${a}`; }
  return new Date(iso).toLocaleDateString("pt-BR");
}
function diasDesde(iso) {
  if (!iso) return "";
  const d = Math.floor((Date.now() - new Date(iso.slice(0, 10) + "T00:00:00")) / 86400000);
  return d === 0 ? "hoje" : `${d} d`;
}
function diasNum(iso) {
  if (!iso) return null;
  return Math.floor((Date.now() - new Date(iso.slice(0, 10) + "T00:00:00")) / 86400000);
}
function ultimoContato(c) {
  return [c.enviada_em, ...(c.followups || [])].filter(Boolean).sort().pop() || "";
}
// "followup" | "parada" | "" — o que a candidatura pede agora
function pendencia(c) {
  if (c.status !== "enviada") return "";
  const d = diasNum(ultimoContato(c));
  if (d === null) return "";
  if (d >= PARADA_DIAS) return "parada";
  if (d >= FOLLOWUP_DIAS && (c.followups || []).length < MAX_FOLLOWUPS) return "followup";
  return "";
}
function idiomaPadrao(c) {
  return /[ãâáàçéêíóôõú]|\b(analista|gerente|coordenador|especialista|vendas|neg[oó]cios)\b/i.test(c.titulo || "") ? "pt" : "en";
}
function textoFollowup(c, idioma) {
  const segundo = (c.followups || []).length > 0;
  const data = dataBR(c.enviada_em);
  if (idioma === "en") return segundo
    ? `Hi! Following up once more on the ${c.titulo} role at ${c.empresa}. I remain interested and available for a conversation whenever it suits you.\n\nBest regards,\nMichel`
    : `Hi! I applied for the ${c.titulo} role at ${c.empresa} on ${data} and I'm still very interested in the position. I'd love to know if there are any updates on the process, and I'm happy to share anything else that would help.\n\nBest regards,\nMichel`;
  return segundo
    ? `Olá! Retomo meu contato sobre a vaga de ${c.titulo} na ${c.empresa}. Sigo interessado e à disposição para uma conversa quando fizer sentido para vocês.\n\nObrigado,\nMichel`
    : `Olá! Me candidatei à vaga de ${c.titulo} na ${c.empresa} em ${data} e continuo muito interessado na posição. Queria saber se há alguma novidade sobre o processo e se posso enviar alguma informação adicional.\n\nObrigado,\nMichel`;
}
function haQuantoTempo(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 2) return "agora";
  if (min < 60) return `há ${min} min`;
  if (min < 48 * 60) return `há ${Math.round(min / 60)} h`;
  return `há ${Math.round(min / 1440)} dias`;
}
// "vagas_triadas_2026-10-28.csv" -> "2026-10-28"
function dataDoNome(nome) { return (nome || "").replace(/^vagas_(triadas|intl)_/, "").replace(".csv", ""); }
function dataRelatorio() { return dataDoNome(dados.relatorio); }
function perfilVaga(v) { return v.perfil || "br"; }
// cada vaga traz o nome do próprio relatório (sincronizar.py, 07/11/2026); as
// sincronizadas antes disso caem no relatório do Perfil 1
function relatorioDaVaga(v) { return v.relatorio || dados.relatorio; }
function dataPerfil(p) {
  const v = dados.vagas.find(x => perfilVaga(x) === p);
  return v ? dataDoNome(relatorioDaVaga(v)) : "";
}
function chipPerfil(p, mini) {
  return p ? `<span class="chip p-${esc(p)}${mini ? " mini" : ""}" title="${p === "intl" ? "Perfil 2: vagas internacionais em dólar" : "Perfil 1: vagas no Brasil"}">${esc(PERFIL_CHIP[p] || p)}</span>` : "";
}
// nova = apareceu no radar pela 1ª vez no dia do relatório do perfil dela
function ehNova(v) { return !!v.adicionada_em && v.adicionada_em === dataDoNome(relatorioDaVaga(v)); }
function aviso(texto) {
  const el = document.getElementById("aviso");
  el.textContent = texto; el.classList.add("visivel");
  clearTimeout(aviso.t); aviso.t = setTimeout(() => el.classList.remove("visivel"), 2600);
}

async function api(caminho, corpo) {
  const r = await fetch(caminho, corpo === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo),
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && caminho !== "/api/login") { mostrarLogin(); throw new Error(j.erro || "Entre com a senha."); }
  if (!r.ok) throw new Error(j.erro || `erro ${r.status}`);
  return j;
}

// --- login ---------------------------------------------------------------------
function mostrarLogin() {
  clearTimeout(agendar.t);
  document.getElementById("abas").innerHTML = "";
  document.getElementById("sair").hidden = true;
  document.getElementById("conteudo").innerHTML = `<form class="login" id="login">
    <h2>Painel de Candidaturas</h2>
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
    <button class="primario">Entrar</button><span class="erro" id="login-erro"></span></form>`;
  document.getElementById("senha").focus();
}
document.getElementById("sair").addEventListener("click", async () => {
  await api("/api/sair", {}).catch(() => {});
  mostrarLogin();
});

// --- carregamento e atualização automática --------------------------------
async function carregar() {
  try { dados = await api("/api/painel"); }
  catch (e) { if (!document.getElementById("login")) aviso("Não consegui falar com o painel: " + e.message); return; }
  document.getElementById("sair").hidden = false;
  const meta = document.getElementById("meta");
  const datas = ["br", "intl"].map(p => [p, dataPerfil(p)]).filter(([, d]) => d);
  meta.textContent = datas.length ? datas.map(([p, d]) => `${PERFIL_CHIP[p]}: vagas de ${dataBR(d)}`).join(" · ")
      + (dados.pc_visto_em ? ` · PC sincronizou ${haQuantoTempo(dados.pc_visto_em)}` : "")
    : dataRelatorio() ? `Vagas de ${dataBR(dataRelatorio())}` : "O PC ainda não mandou as vagas";
  // a rodada é diária: mais de um dia e meio sem notícia do PC merece um aviso
  meta.classList.toggle("atrasado", !dados.pc_visto_em || Date.now() - new Date(dados.pc_visto_em) > 36 * 3600000);
  desenharAbas();
  // não redesenha embaixo de quem está digitando
  const foco = document.activeElement;
  if (!(foco && foco.closest("#conteudo") && ["INPUT", "SELECT", "TEXTAREA"].includes(foco.tagName))) desenhar();
}
function agendar() {
  clearTimeout(agendar.t);
  agendar.t = setTimeout(async () => { await carregar(); agendar(); }, 60000);
}

const POS = Object.keys(STATUS);
function cand(status) { return dados.candidaturas.filter(c => status.includes(c.status)); }

function desenharAbas() {
  const contas = {
    candidaturas: cand(["enviada", "entrevista", "oferta"]).length,
    vagas: dados.vagas.filter(v => v.recomendacao === "aplicar_agora" && !v.status && !v.descartada).length,
    lacunas: suspeitosLacunas().filter(l => !revisao(l.termo)).length,
  };
  document.getElementById("abas").innerHTML = ABAS.map(a => `
    <button class="${a.id === aba ? "ativa" : ""}" data-aba="${a.id}">${a.rotulo}
      <span class="conta">${contas[a.id]}</span></button>`).join("");
}
document.getElementById("abas").addEventListener("click", e => {
  const b = e.target.closest("button[data-aba]"); if (!b) return;
  aba = b.dataset.aba; gravarLocal("aba", aba); desenharAbas(); desenhar();
});

function desenhar() {
  document.getElementById("conteudo").innerHTML = aba === "vagas" ? abaVagas() : aba === "lacunas" ? abaLacunas() : abaCandidaturas();
}

// --- Lacunas (lacunas.py, calculado pelo PC a cada rodada) -----------------------
// provável lacuna: bem mais citado onde o Jev aponta gap — menos o que você já
// marcou "Tenho isso" (vai para "Para pôr no CV" e perde a marca)
function suspeito(l) {
  const r = revisao(l.termo);
  return l.pct_com_gap - l.pct_sem_gap >= DIF_SUSPEITO && !(r && r.avaliacao === "tenho");
}
function suspeitosLacunas() {
  return ((dados.lacunas || {}).linhas || []).filter(suspeito);
}
function revisao(termo) { return (dados.lacunas_revisao || {})[termo]; }
function abaLacunas() {
  const L = dados.lacunas || {};
  if (!(L.linhas || []).length) return `<div class="vazio">O mapa de lacunas chega na próxima vez que o PC rodar a coleta e o sincronizar.py.</div>`;
  const rev = dados.lacunas_revisao || {};
  const tenho = Object.entries(rev).filter(([, r]) => r.avaliacao === "tenho");
  const confirmadas = Object.entries(rev).filter(([, r]) => r.avaliacao === "lacuna");
  const pendentes = suspeitosLacunas().filter(l => !rev[l.termo]);
  const ex = (L.linhas.find(l => l.termo === "SQL") || suspeitosLacunas()[0] || L.linhas[0]);
  const explica = `<div class="cartao resumo-lacunas">
      <h3>Como ler esta aba</h3>
      <p class="sub" style="margin:0">Das ${L.vagas} vagas “aplicar agora” e “avaliar” do relatório de ${dataBR((L.relatorio || "").replace("vagas_triadas_", "").replace(".csv", ""))},
      o Jev diz que em ${L.com_gap} <strong>falta algum requisito obrigatório</strong> para você, mas não diz qual.
      Por isso o radar conta que ferramentas e competências cada vaga pede. Exemplo: <strong>${esc(ex.termo)}</strong> aparece em
      ${ex.pct_com_gap}% das vagas em que falta algo e em ${ex.pct_sem_gap}% das vagas em que não falta nada.
      Quando um termo aparece bem mais onde falta algo, ele provavelmente é o que falta, e ganha a marca <span class="chip atraso" style="margin:0">provável lacuna</span>.</p>
      <p class="sub" style="margin:0">Para cada um, diga se <strong>tem isso</strong> (anote onde usou; vai para a lista do que pôr no CV)
      ou se <strong>é lacuna mesmo</strong>. “Ver vagas” mostra trechos de vagas reais que pedem o termo.
      O que você marca como “Tenho isso” perde a marca de provável lacuna.</p></div>`;
  const listaRev = (titulo, itens, vazio) => `<div class="cartao" style="flex:1;min-width:260px"><h3>${titulo} (${itens.length})</h3>
      ${itens.length ? `<ul style="margin:0;padding-left:18px">${itens.map(([t, r]) => `<li><strong>${esc(t)}</strong>${r.nota ? ` — ${esc(r.nota)}` : ""}</li>`).join("")}</ul>`
        : `<span class="sub">${vazio}</span>`}</div>`;
  const resumo = `<div class="acoes" style="margin-bottom:14px;align-items:stretch">
      ${listaRev("Para pôr no CV", tenho, "Nada ainda. Use “Tenho isso” num termo.")}
      ${listaRev("Lacunas confirmadas", confirmadas, "Nada ainda. Use “É lacuna mesmo” num termo.")}</div>`;
  const barra = `<div class="barra"><select id="filtro-lacunas">
      <option value="provaveis" ${filtroLacunas.ver === "provaveis" ? "selected" : ""}>Prováveis lacunas (${suspeitosLacunas().length})</option>
      <option value="fora" ${filtroLacunas.ver === "fora" ? "selected" : ""}>Fora do CV</option>
      <option value="todos" ${filtroLacunas.ver === "todos" ? "selected" : ""}>Todos os termos (${L.linhas.length})</option></select>
      <span class="sub">${pendentes.length ? `${pendentes.length} provável(is) lacuna(s) sem revisão` : "Todas as prováveis lacunas revisadas"}</span></div>`;
  const linhas = L.linhas.filter(l => filtroLacunas.ver === "todos" ||
    (filtroLacunas.ver === "fora" ? !l.no_cv : suspeito(l)));
  const max = Math.max(...L.linhas.map(l => l.pct_vagas), 1);
  const corpo = linhas.map(l => linhaLacuna(l, max)).join("") ||
    `<tr><td colspan="5" class="vazio">Nenhum termo neste filtro.</td></tr>`;
  return explica + resumo + barra + `<div class="rolagem"><table class="tabela"><thead><tr><th>Termo</th><th>Vagas que pedem</th>
    <th>Aparece em…</th><th>No seu CV</th><th>Sua avaliação</th></tr></thead><tbody>${corpo}</tbody></table></div>`;
}
function linhaLacuna(l, max) {
  const susp = suspeito(l), r = revisao(l.termo);
  const aberta = lacunaAberta && lacunaAberta.termo === l.termo ? lacunaAberta.modo : "";
  const avaliacao = r ? `<span class="chip ${r.avaliacao === "tenho" ? "s-oferta" : "s-recusada"}">${r.avaliacao === "tenho" ? "Tenho isso" : "É lacuna"}</span>
        <button class="discreto" data-acao="lacuna" data-termo="${esc(l.termo)}" data-avaliacao="">Desfazer</button>`
    : `<button data-acao="abrir-tenho" data-termo="${esc(l.termo)}">Tenho isso</button>
       <button data-acao="lacuna" data-termo="${esc(l.termo)}" data-avaliacao="lacuna">É lacuna mesmo</button>`;
  const extra = aberta === "tenho" ? `<tr class="rascunho"><td colspan="5">
      <div class="sub" style="margin-bottom:6px">Onde ou como você usou <strong>${esc(l.termo)}</strong>? Vai para a lista “Para pôr no CV”.</div>
      <div class="acoes"><input id="nota-lacuna" style="flex:1;min-width:240px" value="${esc(lacunaAberta.nota || "")}" placeholder="ex.: SQL no BI da TOTVS, queries no GoodData">
      <button class="primario" data-acao="lacuna" data-termo="${esc(l.termo)}" data-avaliacao="tenho">Salvar</button>
      <button class="discreto" data-acao="fechar-lacuna">Cancelar</button></div></td></tr>`
    : aberta === "exemplos" ? `<tr class="rascunho"><td colspan="5">${(l.exemplos || []).map(e => `<div style="margin-bottom:8px">
        <a href="${esc(e.link)}" target="_blank" rel="noopener"><strong>${esc(e.titulo)}</strong></a> <span class="sub">· ${esc(e.empresa)} · nota ${nota(e.nota_fit)}${e.gap_critico === "sim" ? " · falta requisito" : ""}</span>
        <div class="sub">${esc(e.trecho)}</div></div>`).join("") || `<span class="sub">Sem exemplos neste relatório.</span>`}
        <button class="discreto" data-acao="fechar-lacuna">Fechar</button></td></tr>` : "";
  return `<tr>
    <td><strong>${esc(l.termo)}</strong>${susp ? `<span class="chip atraso">provável lacuna</span>` : ""}
      <div><button class="discreto link" style="padding:2px 0" data-acao="exemplos" data-termo="${esc(l.termo)}">${aberta === "exemplos" ? "Esconder vagas" : "Ver vagas"}</button></div></td>
    <td style="white-space:nowrap"><span class="barra-pct" style="width:${Math.round(100 * l.pct_vagas / max)}px"></span>${l.vagas} (${l.pct_vagas}%)
      <div class="sub" title="Citado sem “desejável”, “diferencial”, “plus”… por perto">${l.obrigatorio} como obrigatório</div></td>
    <td><div class="duas"><span>${l.pct_com_gap}%</span><span><span class="barra-pct gap" style="width:${l.pct_com_gap * 1.5}px"></span>onde falta algo</span>
      <span>${l.pct_sem_gap}%</span><span><span class="barra-pct semgap" style="width:${l.pct_sem_gap * 1.5}px"></span>onde não falta nada</span></div></td>
    <td class="cv sub">${l.no_cv ? esc(l.no_cv) : r && r.avaliacao === "tenho" ? `não aparece no cv.txt, mas você tem${r.nota ? `: ${esc(r.nota)}` : ""}`
      : `<span style="color:var(--alerta)">não aparece</span>`}</td>
    <td style="white-space:nowrap">${avaliacao}</td></tr>${extra}`;
}

// --- Candidaturas ------------------------------------------------------------
function formularioCandidatura() {
  if (!formCand) return `<div class="barra"><button class="primario" data-acao="nova-cand">+ Adicionar candidatura</button>
    <span class="sub">Para uma vaga de fora do relatório (LinkedIn, site da empresa…)</span></div>`;
  const campo = (nome, rotulo, tipo = "text", extra = "") => `<label>${rotulo}
    <input name="${nome}" type="${tipo}" value="${esc(formCand[nome] || "")}" ${extra}></label>`;
  return `<form class="cartao form-cand" id="form-cand">
    <h3>Adicionar candidatura</h3>
    <div class="grade-form">
      ${campo("titulo", "Vaga", "text", "required")}
      ${campo("empresa", "Empresa", "text", "required")}
      ${campo("link", "Link da vaga (opcional)", "url", 'placeholder="https://…"')}
      ${campo("enviada_em", "Enviada em", "date", "required")}
      <span class="largo">${campo("notas", "Anotações (opcional)")}</span>
    </div>
    <div class="acoes"><button class="primario">Salvar como enviada</button>
      <button type="button" data-acao="cancelar-cand">Cancelar</button></div></form>`;
}
function abaCandidaturas() {
  const todas = cand(POS);
  const contas = Object.fromEntries(POS.map(s => [s, todas.filter(c => c.status === s).length]));
  const ativas = todas.filter(c => ["enviada", "entrevista", "oferta"].includes(c.status));
  const pedem = todas.filter(c => pendencia(c));
  const botoes = [["ativas", "Em andamento", ativas.length], ["acao", "Pedem follow-up", pedem.length],
                  ...POS.map(s => [s, STATUS[s], contas[s]])];
  const lista = (filtroFunil === "ativas" ? ativas : filtroFunil === "acao" ? pedem : todas.filter(c => c.status === filtroFunil))
    .sort((a, b) => (b.enviada_em || "").localeCompare(a.enviada_em || ""));
  const topo = formularioCandidatura() + `<div class="funil">${botoes.map(([id, rot, n]) => `
    <button class="${filtroFunil === id ? "ativa" : ""}" data-acao="funil" data-filtro="${id}">
      <span class="qtd">${n}</span><span class="rot">${esc(rot)}</span></button>`).join("")}</div>`;
  if (!todas.length) return topo + `<div class="vazio">Nenhuma candidatura ainda. Use “Já enviei” numa vaga de hoje
    ou “+ Adicionar candidatura” para uma vaga de fora do relatório.</div>`;
  if (!lista.length) return topo + `<div class="vazio">Nenhuma candidatura neste filtro.</div>`;
  return topo + `<div class="rolagem"><table class="tabela"><thead><tr>
    <th>Vaga</th><th>Status</th><th>Enviada em</th><th class="num">Há</th><th>Anotações</th><th></th></tr></thead><tbody>
    ${lista.map(c => linhaCandidatura(c)).join("")}</tbody></table></div>`;
}
function linhaCandidatura(c) {
  const p = pendencia(c), nf = (c.followups || []).length;
  const chip = p === "parada" ? `<span class="chip atraso" title="Sem resposta há ${diasNum(ultimoContato(c))} dias">Parada</span>`
    : p === "followup" ? `<span class="chip atraso" title="${FOLLOWUP_DIAS}+ dias sem resposta">Follow-up</span>` : "";
  const acao = p === "parada" ? `<button data-acao="encerrar" data-id="${c.id}" title="Mudar o status para Encerrada">Encerrar</button>`
    : p === "followup" ? `<button data-acao="rascunho" data-id="${c.id}">Rascunho</button>` : "";
  const fups = nf ? `<div class="sub">${nf} follow-up${nf > 1 ? "s" : ""} · último ${dataBR(c.followups[nf - 1])}</div>` : "";
  const aberto = rascunho && rascunho.id === c.id ? `<tr class="rascunho"><td colspan="6">
      <div class="sub" style="margin-bottom:6px">Rascunho de follow-up ${nf + 1} de ${MAX_FOLLOWUPS}. Revise, copie e mande pelo canal onde se candidatou; nada é enviado daqui.</div>
      <textarea id="texto-rascunho">${esc(rascunho.texto)}</textarea>
      <div class="acoes">
        <button data-acao="idioma" data-idioma="${rascunho.idioma === "pt" ? "en" : "pt"}">${rascunho.idioma === "pt" ? "Em inglês" : "Em português"}</button>
        <button data-acao="copiar">Copiar</button>
        <button class="primario" data-acao="followup-enviado" data-id="${c.id}">Já mandei este follow-up</button>
        <button class="discreto" data-acao="fechar-rascunho">Fechar</button></div></td></tr>` : "";
  return `<tr>
      <td class="vaga">${/^https?:/.test(c.link) ? `<a href="${esc(c.link)}" target="_blank" rel="noopener"><strong>${esc(c.titulo)}</strong></a>`
          : `<strong>${esc(c.titulo)}</strong>`}
        <div class="sub">${esc(c.empresa)}${c.fonte === "manual" ? " · adicionada à mão" : ""}${chipPerfil(c.perfil, true)}</div></td>
      <td><select data-acao="status" data-id="${c.id}">${POS.map(s =>
        `<option value="${s}" ${s === c.status ? "selected" : ""}>${STATUS[s]}</option>`).join("")}</select></td>
      <td>${dataBR(c.enviada_em)}</td>
      <td class="num sub">${diasDesde(c.enviada_em)}${chip}${fups}</td>
      <td><input class="notas" data-acao="notas" data-id="${c.id}" value="${esc(c.notas)}" placeholder="ex.: recrutadora Ana, retorno sexta"></td>
      <td class="num">${acao}<button class="discreto" data-acao="excluir" data-id="${c.id}" title="Excluir este registro">Excluir</button></td>
    </tr>${aberto}`;
}

// --- Vagas de hoje -------------------------------------------------------------
function abaVagas() {
  const f = filtroVagas;
  const busca = f.busca.toLowerCase();
  const lista = dados.vagas.filter(v =>
    (f.rec === "todas" || v.recomendacao === f.rec) &&
    (f.perfil === "todos" || perfilVaga(v) === f.perfil) &&
    (!f.esconder || (!v.status && !v.descartada)) &&
    (!f.novas || ehNova(v)) &&
    (!busca || `${v.titulo} ${v.empresa}`.toLowerCase().includes(busca)));
  const novas = lista.filter(ehNova).length;
  const barra = `<div class="barra">
    <input type="search" id="busca" placeholder="Buscar por vaga ou empresa" value="${esc(f.busca)}">
    <select id="rec">
      <option value="aplicar_agora" ${f.rec === "aplicar_agora" ? "selected" : ""}>Aplicar agora</option>
      <option value="avaliar" ${f.rec === "avaliar" ? "selected" : ""}>Avaliar</option>
      <option value="todas" ${f.rec === "todas" ? "selected" : ""}>As duas</option>
    </select>
    <label class="sub"><input type="checkbox" id="esconder" ${f.esconder ? "checked" : ""}> Esconder enviadas e descartadas</label>
    <label class="sub"><input type="checkbox" id="novas" ${f.novas ? "checked" : ""}> Só as novas</label>
    <label class="sub"><input type="checkbox" id="descartadas" ${f.descartadas ? "checked" : ""}> Ver descartadas (${dados.descartes.length})</label>
    <span class="sub">${lista.length} vaga(s)${novas ? ` · ${novas} nova(s)` : ""}</span></div>`;
  if (f.descartadas) return barra + listaDescartes();
  const topo = cartoesPerfil() + barra;
  if (!dados.vagas.length) return topo + `<div class="vazio">As vagas do dia chegam quando o PC roda a coleta diária.</div>`;
  if (f.perfil === "intl" && !dados.vagas.some(v => perfilVaga(v) === "intl"))
    return topo + `<div class="vazio">As vagas do Perfil 2 chegam depois da próxima rodada diária, que roda o Perfil 2 logo depois do Perfil 1.</div>`;
  if (!lista.length) return topo + `<div class="vazio">Nenhuma vaga com esse filtro.</div>`;
  const linhas = lista.slice(0, f.limite).map(v => `<tr class="perfil-${esc(perfilVaga(v))}">
      <td class="num"><span class="nota">${nota(v.nota_fit)}</span></td>
      <td class="vaga"><a href="${esc(v.link)}" target="_blank" rel="noopener">${esc(v.titulo)}</a>${ehNova(v) ? `<span class="chip nova">Nova</span>` : ""}${
        Number(v.idade_dias) > DIAS_VAGA_ANTIGA ? `<span class="chip atraso" title="Publicada em ${esc(v.publicado_em)}">no ar há ${esc(v.idade_dias)} d</span>` : ""}${
        /dirigido a IA/.test(v.alerta || "") ? `<span class="chip alerta" title="${esc(v.alerta)}">⚠ texto suspeito</span>` : ""}
        <div class="sub">${esc(v.empresa)}${v.salario ? " · " + esc(v.salario) : ""}${
          perfilVaga(v) === "intl" ? [ELEGIB[v.elegibilidade], TIPO_EMPRESA[v.tipo_empresa] || v.tipo_empresa, INGLES[v.ingles_exigido]]
            .filter(Boolean).map(x => " · " + esc(x)).join("") : ""}</div></td>
      <td>${chipPerfil(perfilVaga(v))}</td>
      <td class="sub" title="Dia em que a vaga apareceu no radar pela 1ª vez">${dataBR(v.adicionada_em)}</td>
      <td class="sub">${esc(v.fonte)}</td>
      <td class="sub">${esc(v.cidade || (v.remoto === "True" ? "Remoto" : ""))}</td>
      <td class="num" style="white-space:nowrap">${v.status ? chipStatus(v.status)
        : v.descartada ? `<span class="chip s-encerrada" title="${esc(v.descartada)}">Descartada</span>
            <button class="discreto" data-acao="desfazer-descarte" data-link="${esc(v.link)}">Desfazer</button>`
        : `<button class="primario" data-acao="ja-enviei" data-link="${esc(v.link)}">Já enviei</button>
           <button data-acao="abrir-descarte" data-link="${esc(v.link)}">Descartar</button>`}</td></tr>${
      descarte && descarte.link === v.link ? linhaDescarte() : ""}`).join("");
  const mais = lista.length > f.limite ? `<div class="barra" style="justify-content:center;margin-top:12px">
    <button data-acao="mais">Mostrar mais (${lista.length - f.limite})</button></div>` : "";
  return topo + `<div class="rolagem"><table class="tabela"><thead><tr><th class="num">Nota</th><th>Vaga</th>
    <th>Perfil</th><th>Adicionada em</th><th>Fonte</th><th>Local</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div>` + mais;
}

// um cartão por perfil (e "Os dois"): quantas vagas pendentes cada um tem hoje
function cartoesPerfil() {
  const f = filtroVagas;
  const pend = p => dados.vagas.filter(v => (p === "todos" || perfilVaga(v) === p) && !v.status && !v.descartada);
  const conta = (p, r) => pend(p).filter(v => v.recomendacao === r).length;
  const cartao = (p, nome, desc) => {
    const d = p === "todos" ? "" : dataPerfil(p);
    return `<button class="${p} ${f.perfil === p ? "ativa" : ""}" data-acao="perfil" data-perfil="${p}">
      <span class="nome">${esc(nome)}</span><span class="sub">${esc(desc)}</span>
      <span><span class="qtd">${conta(p, "aplicar_agora")}</span> <span class="sub">aplicar agora · ${conta(p, "avaliar")} avaliar</span></span>
      <span class="sub">${p === "todos" ? "Brasil e internacional juntos" : d ? `relatório de ${dataBR(d)}` : "ainda sem relatório"}</span></button>`;
  };
  return `<div class="perfis">${cartao("br", "Perfil 1 · Brasil", PERFIL_DESC.br)}${cartao("intl", "Perfil 2 · Internacional", PERFIL_DESC.intl)}${
    cartao("todos", "Os dois perfis", "Tudo numa lista só")}</div>`;
}

function linhaDescarte() {
  return `<tr class="rascunho"><td colspan="7">
    <div class="sub" style="margin-bottom:6px">Por que descartar? O motivo fica salvo para a gente analisar depois.</div>
    <div class="acoes">${dados.motivos_descarte.map(m => `<button class="${descarte.motivo === m ? "primario" : ""}"
      data-acao="motivo" data-motivo="${esc(m)}">${esc(m)}</button>`).join("")}</div>
    <div class="acoes" style="margin-top:8px"><input id="nota-descarte" style="flex:1;min-width:240px" value="${esc(descarte.nota || "")}" placeholder="Detalhe (opcional)">
      <button class="primario" data-acao="confirmar-descarte" ${descarte.motivo ? "" : "disabled"}>Descartar</button>
      <button class="discreto" data-acao="cancelar-descarte">Cancelar</button></div></td></tr>`;
}
function listaDescartes() {
  const ds = [...dados.descartes].sort((a, b) => (b.em || "").localeCompare(a.em || ""));
  if (!ds.length) return `<div class="vazio">Nenhuma vaga descartada ainda.</div>`;
  const contas = {};
  ds.forEach(d => { contas[d.motivo] = (contas[d.motivo] || 0) + 1; });
  const resumo = `<div class="funil">${Object.entries(contas).sort((a, b) => b[1] - a[1]).map(([m, n]) => `
    <div class="cartao" style="padding:10px 14px;gap:0;min-width:150px"><span class="qtd" style="font-size:22px;font-weight:700">${n}</span>
    <span class="sub">${esc(m)}</span></div>`).join("")}</div>`;
  return resumo + `<div class="rolagem"><table class="tabela"><thead><tr><th>Descartada em</th><th class="num">Nota</th><th>Vaga</th><th>Motivo</th><th>Detalhe</th><th></th></tr></thead><tbody>
    ${ds.map(d => `<tr><td class="sub">${dataBR(d.em)}</td><td class="num"><span class="nota">${nota(d.nota_fit)}</span></td>
      <td class="vaga">${/^https?:/.test(d.link) ? `<a href="${esc(d.link)}" target="_blank" rel="noopener">${esc(d.titulo)}</a>` : esc(d.titulo)}
        <div class="sub">${esc(d.empresa)}${chipPerfil(d.perfil, true)}</div></td>
      <td>${esc(d.motivo)}</td><td class="sub">${esc(d.nota)}</td>
      <td class="num"><button class="discreto" data-acao="desfazer-descarte" data-link="${esc(d.link)}">Desfazer</button></td></tr>`).join("")}
    </tbody></table></div>`;
}

// --- ações ---------------------------------------------------------------------
const conteudo = document.getElementById("conteudo");
conteudo.addEventListener("click", async e => {
  const b = e.target.closest("[data-acao]"); if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
  const { acao, id } = b.dataset;
  try {
    if (acao === "funil") { filtroFunil = b.dataset.filtro; desenhar(); return; }
    if (acao === "mais") { filtroVagas.limite += 150; desenhar(); return; }
    if (acao === "perfil") { filtroVagas.perfil = b.dataset.perfil; gravarLocal("perfil", b.dataset.perfil); filtroVagas.limite = 150; desenhar(); return; }
    if (acao === "nova-cand") {
      formCand = { enviada_em: hojeISO() }; desenhar();
      document.querySelector('#form-cand [name="titulo"]').focus(); return;
    }
    if (acao === "cancelar-cand") { formCand = null; desenhar(); return; }
    if (acao === "rascunho") {
      const c = dados.candidaturas.find(x => x.id === id), idioma = idiomaPadrao(c);
      rascunho = { id, idioma, texto: textoFollowup(c, idioma) }; desenhar(); return;
    }
    if (acao === "idioma") {
      const c = dados.candidaturas.find(x => x.id === rascunho.id);
      rascunho = { ...rascunho, idioma: b.dataset.idioma, texto: textoFollowup(c, b.dataset.idioma) }; desenhar(); return;
    }
    if (acao === "copiar") {
      await navigator.clipboard.writeText(rascunho.texto).then(() => aviso("Copiado."), () => aviso("Não consegui copiar; selecione o texto."));
      return;
    }
    if (acao === "fechar-rascunho") { rascunho = null; desenhar(); return; }
    if (acao === "abrir-descarte") { descarte = { link: b.dataset.link, motivo: "", nota: "" }; desenhar(); return; }
    if (acao === "motivo") { descarte.motivo = b.dataset.motivo; desenhar(); return; }
    if (acao === "cancelar-descarte") { descarte = null; desenhar(); return; }
    if (acao === "abrir-tenho") { lacunaAberta = { termo: b.dataset.termo, modo: "tenho", nota: "" }; desenhar();
      document.getElementById("nota-lacuna").focus(); return; }
    if (acao === "exemplos") {
      lacunaAberta = lacunaAberta && lacunaAberta.termo === b.dataset.termo && lacunaAberta.modo === "exemplos" ? null
        : { termo: b.dataset.termo, modo: "exemplos" };
      desenhar(); return;
    }
    if (acao === "fechar-lacuna") { lacunaAberta = null; desenhar(); return; }
    if (acao === "ja-enviei") {
      b.disabled = true;
      await api("/api/candidatura", dados.vagas.find(x => x.link === b.dataset.link));
      aviso("Marcada como enviada — está na aba Candidaturas.");
    } else if (acao === "confirmar-descarte") {
      b.disabled = true;
      await api("/api/descartar", descarte); descarte = null; aviso("Vaga descartada.");
    } else if (acao === "desfazer-descarte") {
      await api("/api/desfazer-descarte", { link: b.dataset.link }); aviso("Descarte desfeito.");
    } else if (acao === "lacuna") {
      const av = b.dataset.avaliacao;
      await api("/api/lacuna", { termo: b.dataset.termo, avaliacao: av, nota: av === "tenho" ? (lacunaAberta || {}).nota || "" : "" });
      lacunaAberta = null; aviso(av === "tenho" ? "Anotado em “Para pôr no CV”." : av ? "Marcada como lacuna." : "Avaliação desfeita.");
    } else if (acao === "followup-enviado") {
      b.disabled = true;
      await api("/api/followup", { id }); rascunho = null; aviso("Follow-up registrado.");
    } else if (acao === "encerrar") {
      const c = dados.candidaturas.find(x => x.id === id);
      if (!confirm(`Encerrar “${c.titulo}” (${c.empresa})? Sem resposta há ${diasNum(ultimoContato(c))} dias.`)) return;
      await api("/api/status", { id, status: "encerrada" }); aviso("Candidatura encerrada.");
    } else if (acao === "excluir") {
      const c = dados.candidaturas.find(x => x.id === id);
      if (!confirm(`Excluir o registro de “${c.titulo}” (${c.empresa})?`)) return;
      await api("/api/excluir", { id }); aviso("Registro excluído.");
    }
    await carregar();
  } catch (err) { aviso(err.message); b.disabled = false; }
});
conteudo.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "rec") { filtroVagas.rec = el.value; filtroVagas.limite = 150; desenhar(); return; }
  if (el.id === "esconder") { filtroVagas.esconder = el.checked; desenhar(); return; }
  if (el.id === "filtro-lacunas") { filtroLacunas.ver = el.value; lacunaAberta = null; desenhar(); return; }
  if (el.id === "descartadas") { filtroVagas.descartadas = el.checked; desenhar(); return; }
  if (el.id === "novas") { filtroVagas.novas = el.checked; filtroVagas.limite = 150; desenhar(); return; }
  try {
    if (el.dataset.acao === "status") { await api("/api/status", { id: el.dataset.id, status: el.value }); aviso("Status atualizado."); }
    else if (el.dataset.acao === "notas") { await api("/api/notas", { id: el.dataset.id, notas: el.value }); aviso("Anotação salva."); }
    else return;
    el.blur(); await carregar();
  } catch (err) { aviso(err.message); }
});
conteudo.addEventListener("input", e => {
  if (formCand && e.target.closest("#form-cand")) { formCand[e.target.name] = e.target.value; return; }
  if (rascunho && e.target.id === "texto-rascunho") { rascunho.texto = e.target.value; return; }
  if (descarte && e.target.id === "nota-descarte") { descarte.nota = e.target.value; return; }
  if (lacunaAberta && e.target.id === "nota-lacuna") { lacunaAberta.nota = e.target.value; return; }
  if (e.target.id !== "busca") return;
  filtroVagas.busca = e.target.value; filtroVagas.limite = 150;
  const pos = e.target.selectionStart;
  desenhar();
  const novo = document.getElementById("busca"); novo.focus(); novo.setSelectionRange(pos, pos);
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "form-cand") {
    try {
      await api("/api/candidatura", formCand);
      formCand = null; filtroFunil = "ativas";
      aviso("Candidatura adicionada.");
      await carregar();
    } catch (err) { aviso(err.message); }
  } else if (e.target.id === "login") {
    try {
      await api("/api/login", { senha: document.getElementById("senha").value });
      await carregar(); agendar();
    } catch (err) { document.getElementById("login-erro").textContent = err.message; }
  }
});

carregar().then(agendar);
</script>
</body>
</html>

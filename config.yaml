      - board: "lalamove"   # 05/10/2026 via /radar — Lalamove: "Analista Sênior de Estratégia",
        country: "BR"       # "Analista de Operações de Vendas". Board global (185 vagas) — só Brasil.
      - "ciandt"       # CI&T (consultoria/tech, atua globalmente) — vagas remoto Brasil confirmadas (histórico do projeto, sem coletor até agora)


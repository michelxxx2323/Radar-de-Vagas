# Configuração da triagem. Edite os campos abaixo antes de rodar.

# Caminho do arquivo com o texto do seu currículo (plain text).
# Já vem preenchido com o texto extraído do CV_Michel_MESTRE.docx (OneDrive > CVs- Claude).
# Se você atualizar o CV MESTRE, re-rode a extração (ver README, seção "Atualizar o CV")
# para manter o cv.txt em dia.
cv_path: "cv.txt"

# Termos de busca — usados pelas fontes com busca por palavra-chave (Gupy,
# beBee, We Work Remotely) e também como filtro de título nas fontes que só
# fazem sentido por empresa (Greenhouse, InHire). Alinhados às 4 frentes do
# seu próprio CV (RevOps, GTM/BD, Business Analyst/Estratégia,
# E-commerce/Marketplace). Ajuste livremente.
search_terms:
  - "revenue operations"
  - "business development"
  - "analista de negocios"
  - "estrategia"
  - "growth"
  - "parcerias"
  - "e-commerce"
  - "product operations"
  - "marketplace"
  # adicionados em 25/09/2026 — na Gupy, "go to market" e "go-to-market" trazem as
  # mesmas vagas, mas "gtm" traz outras (ex.: "Analista de GTM Sênior")
  - "go to market"
  - "gtm"
  # adicionados em 25/09/2026 a pedido do Michel
  - "revops"
  - "sales operations"
  - "business analyst"
  - "strategy"
  - "planejamento comercial"
  - "category"
  - "vendor"
  - "seller"
  - "dtc"
  - "d2c"

# Suas preferências, enviadas ao Jev junto com o CV em cada avaliação. O CV diz
# o que você JÁ FEZ; isto diz o que você QUER e NÃO QUER fazer — sem isso, o Jev
# achava aderente, por exemplo, vaga de vendedor/hunter só porque o CV tem
# experiência de seller em marketplace e prospecção de parcerias (caso real:
# "Gerente de Contas, Marketplace" da Amazon ficava acima de "Retail Vendor
# Management - VAP"). Mudar este texto faz o script repontuar todas as vagas
# automaticamente na próxima rodada.
# Calibrado com gabarito.csv (python calibrar.py): o bloco QUERO/NÃO QUERO
# levou o acerto de pares de 52% pra 70%.
#
# PRIVACIDADE: se existir um arquivo `preferencias.txt` na pasta do projeto
# (fora do git — ver .gitignore), ele substitui o texto abaixo. As
# preferências reais ficam lá; o texto abaixo é só um EXEMPLO.
preferencias: |
  QUERO: vagas analíticas e estratégicas — Revenue/Sales Operations, Business
  Analyst, estratégia, Go-to-Market, gestão de marketplace/e-commerce. Gestão
  de contas ou parceiros é bem-vinda quando o foco é a performance de
  parceiros já existentes (dados, métricas, P&L, pricing, negociação
  estratégica).
  NÃO QUERO: vagas de vendas tradicionais que exigem experiência como
  executivo de vendas (meta de receita individual, SDR/BDR, inside sales).
  Prospectar e recrutar novos parceiros é bem-vindo.
  REQUISITOS TÉCNICOS: só contam como lacuna séria quando a vaga exige nível
  avançado (ex.: SQL/Python avançado). Barreiras de localização, idioma ou
  elegibilidade continuam valendo.
  SENIORIDADE: vagas de nível pleno, sênior ou especialista são compatíveis;
  analista/assistente júnior não é.

# Filtro por título nas fontes POR EMPRESA (Greenhouse, InHire, Lever, Ashby,
# Mercado Livre), que trazem todas as vagas abertas de cada empresa — inclusive
# engenharia, jurídico etc. Só vagas cujo título contém algum destes trechos
# vão pro Jev (sem diferenciar maiúsculas/acentos; "estrateg" pega
# estratégia/estratégico). As fontes com busca por termo não passam por aqui.
# Calibrado em 23/09/2026 contra a rodada de 21/09: mantém 30/30 vagas
# "aplicar_agora" e 360/431 "avaliar" (as perdidas tinham nota ≤ 6,2 — compras,
# fraude, controladoria, "Banco de Talentos"...), cortando ~48% das chamadas.
# Deixe a lista vazia ([]) pra desligar o filtro e mandar tudo pro Jev.
title_keywords:
  # RevOps / vendas
  - "revenue"
  - "revops"
  - "receita"
  - "sales"
  - "vendas"
  - "comercia"      # pega comercial, comerciais e comercialização
  - "commercial"
  - "pricing"
  - "precific"
  - "crm"
  # BD / parcerias / GTM
  - "business"
  - "negocio"
  - "bizops"
  - "parceri"
  - "partner"
  - "alianca"
  - "alliance"
  - "channel"
  - "canais"
  - "affiliate"
  - "afiliad"
  - "go-to-market"
  - "go to market"
  - "gtm"
  - "expans"
  - "originac"
  - "account"
  - "contas"
  - "relacionamento"
  - "relationship"
  - "vendor"
  - "seller"
  - "merchant"
  # estratégia / análise
  - "estrateg"
  - "strateg"
  - "planejamento"
  - "planning"
  - "inteligencia"
  - "intelligence"
  - "insights"
  - "analytics"
  - "data analyst"
  - "analista de dados"
  - "fp&a"
  - "m&a"
  - "performance"
  # growth / e-commerce / marketplace
  - "growth"
  - "crescimento"
  - "marketplace"
  - "e-commerce"
  - "ecommerce"
  - "online"
  - "varejo"
  - "retail"
  - "category"
  - "categoria"
  - "trade"
  - "merchandis"
  - "marketing"
  - "dtc"
  - "d2c"
  - "direct to consumer"
  - "direct-to-consumer"
  # produto / ops / gestão
  - "product manag"
  - "gerente de produto"
  - "operation"   # 30/09/2026: singular pega "operations" e "Operation Manager" (TikTok)
  - "operacoes"
  - "operacao"      # singular: "Analista de Operação Comercial"
  - "program manager"
  - "project manag"
  - "projetos"
  - "customer success"
  - "sucesso do cliente"
  - "city manager"
  - "country"
  - "trainee"

# Trechos de título que DESCARTAM a vaga antes do Jev, em todas as fontes —
# mesmo que ela bata com title_keywords (ex.: "Supervisor de Vendas - Renner -
# Jundiaí" bate com "vendas", mas é vaga de loja). Mesma regra: sem diferenciar
# maiúsculas/acentos, trecho em qualquer parte do título. Criada em 25/09/2026
# ao adicionar varejo (Renner, Boticário, C&A) e Shopee: das 512 vagas dessas
# fontes que passavam no filtro, ~270 eram loja/logística/engenharia.
# Cuidado com trechos curtos: "intern" pegaria "Internacional"; "loja" pegaria
# "LOJAS RENNER | Analista de E-commerce" — por isso "loja " e "de loja".
title_exclude:
  # vendas tradicionais (26/10/2026 — preferência: não quer vaga que exige
  # experiência de executivo de vendas; no relatório de 26/10 todas as 124
  # vagas com esse título estavam em "nao_aplicar")
  - "executivo de vendas"
  - "executivo(a) de vendas"
  - "executiva de vendas"
  # varejo / loja
  - "loja "
  - "de loja"
  - "vendedor"
  - "vendedora"
  - "consultor de vendas"
  - "consultora de vendas"
  - "consultor(a) de vendas"
  - "assistente de vendas"
  - "supervisor de vendas"
  - "supervisor(a) de vendas"
  - "supervisor comercial"
  - "forca de vendas"
  - "forca vendas"
  - "visual merchandising"
  - "caixa"
  - "fiscal"
  - "promotor"
  - "inauguracao"
  # operacional / logística
  - "operador"
  - "operadora"
  - "auxiliar"
  - "motorista"
  - "empilhadeira"
  - "operacoes logisticas"   # só a operação em si — "Analista de Negócios | Logística" fica
  - "intralogistic"
  - "xpt"
  - "esteira"
  - "armazem"
  # entrada de carreira
  - "aprendiz"
  - "estagi"
  # engenharia / desenvolvimento ("developer" ficou de fora: pegaria
  # "Partnerships Manager, AWS Developer Experience")
  - "desenvolvedor"
  - "desenvolvedora"
  - "engenheir"
  - "engineer"

# Fontes de vagas habilitadas.
sources:
  # API pública da Gupy (jobName=termo). Cobre muitas empresas brasileiras.
  gupy:
    enabled: true
    city: ""   # opcional, ex: "São Paulo"
    # Limite próprio da Gupy, por termo (o limit_per_term geral lá embaixo vale
    # pras outras fontes). Era 15 até 25/09/2026 — "e-commerce" tinha 213 vagas
    # na Gupy e só 15 entravam; "growth", 57.
    limit_per_term: 150
    # Empresas grandes na Gupy de onde puxar TODAS as vagas (filtradas por
    # title_keywords), além da busca por termo. O nome tem que ser o da career
    # page na Gupy, exatamente (conferido em 25/09/2026). Riachuelo aparece na
    # Gupy mas com 0 vagas pelo nome "Riachuelo" — ficou de fora.
    empresas:
      # 30/09/2026: Americanas SAIU da Gupy (americanas.gupy.io dá 404, 0 vagas).
      # Pelo carreiras.americanas.io, loja -> Pandapé/InfoJobs e escritório ->
      # só LinkedIn. Não dá pra coletar; fica coberta pelo /radar.
      - "PagBank"             # 26/10/2026 via /radar — "Gerente de Operações de Canais", Coordenador de
                              # Canais (Performance & Analytics), Estratégia Comercial, Operações de Vendas
      - "AXIA Energia"        # 05/10/2026 via /radar — "Especialista de eficiência e inteligência comercial"
      - "Lojas Renner"
      - "Cia. Hering"
      - "Grupo Boticário"
      - "C&A Brasil"
      # -- adicionadas em 29/09/2026, a partir do teste com o LinkedIn (vagas do
      # perfil que o script não tinha) --
      - "Hypera Pharma"          # "Analista de Planejamento de Vendas Sênior"
      - "Fast Shop S/A"          # e-commerce/varejo
      - "Porto"                  # "Analista Planejamento Comercial Sênior (Porto Bank)"
      - "Farmácias Pague Menos"  # "Analista de Planejamento Comercial Sênior"
      - "Swift"                  # "Analista de Planejamento e Inteligência de Vendas SR"

  # API pública do Remotive. Vagas remotas/internacionais em inglês.
  remotive:
    enabled: true
    category: ""   # opcional, ex: "business"

  # Feed RSS oficial do We Work Remotely. Vagas remotas/internacionais.
  weworkremotely:
    enabled: true
    category: "remote-sales-and-marketing-jobs"   # veja outras categorias no site

  # Workable (jobs.workable.com) — 15/10/2026: portal que junta as vagas de
  # todas as empresas que usam o Workable (muitas startups/tech estrangeiras
  # no Brasil). Busca por cada search_term, só no país abaixo; passa pelo
  # filtro de título. Ver collectors/workable.py.
  workable:
    enabled: true
    location: "Brazil"
    limit_per_term: 60

  # 99 (DiDi) — 30/09/2026: a 99 publica no site da DiDi (careers.didiglobal.com),
  # não na Gupy. API JSON do próprio site (ver collectors/didi.py); ~100 vagas
  # no Brasil, filtradas por title_keywords.
  didi:
    enabled: true
    country: "Brazil"

  # --- Remoto internacional (29/09/2026): empresas de fora que aceitam quem
  # mora no Brasil/LATAM. Em todas as fontes remotas (Remotive e We Work
  # Remotely também) só entram vagas cujo local cita Brasil, LATAM, Américas
  # ou "anywhere/worldwide" — "USA only", "Europe" etc. ficam de fora.
  # hiring.cafe ficou de fora: bloqueia acesso automatizado (Cloudflare).

  # API pública do Remote OK. Os termos de uso pedem crédito e link pra página
  # da vaga no Remote OK — o link salvo é sempre o deles.
  remoteok:
    enabled: true
    # tags buscadas (além da lista geral); sem busca por termo, então o
    # filtro de título (title_keywords) é que decide o que vai pro Jev
    tags: ["sales", "marketing", "operations", "business", "strategy", "ecommerce",
           "analyst", "account manager", "growth", "product manager", "customer success"]

  # Remote.io: páginas de listagem por local x área (até 20 vagas cada).
  remoteio:
    enabled: true
    locais: ["brazil", "latin-america", "anywhere"]
    areas: ["", "operations", "sales-partnerships", "business-development", "marketing",
            "product", "finance", "data", "executive-c-suite", "other"]

  # Scraping best-effort do HTML server-rendered da busca da beBee (sem API
  # pública). Cada termo de busca vira até bebee.max_pages_per_term páginas
  # de resultado (a beBee costuma trazer ~10-20 vagas por página).
  # 25/09/2026: a busca da beBee parou de devolver vagas pra acesso
  # automatizado (a página abre, mas a lista vem vazia — funcionava em 23/09).
  # Mantida ligada: se voltar, as vagas reaparecem sozinhas; enquanto isso o
  # screen.py avisa "fonte 'bebee' ... não trouxe nenhuma vaga".
  bebee:
    enabled: true
    max_pages_per_term: 2

  # API pública não documentada oficialmente, mas usada pelo próprio
  # amazon.jobs (descoberta inspecionando a rede em 21/09/2026). Busca por
  # termo, igual à Gupy/Remotive.
  amazon:
    enabled: true
    country: "BRA"

  # Scraping best-effort do HTML da página de vagas do Mercado Livre/Mercado
  # Pago — sem API pública, e com risco de bloqueio antibot (ver aviso em
  # collectors/mercadolivre.py). Não tem busca por termo — traz as
  # max_pages primeiras páginas de vagas do Brasil e deixa o Jev filtrar.
  # DESLIGADO em 23/09/2026: a página careers-meli.mercadolibre.com não traz mais
  # as vagas no HTML — elas vêm do Eightfold (mercadolibre.eightfold.ai) via
  # JavaScript, e a API do Eightfold responde 403 pra acesso automatizado, mesmo
  # simulando navegador. Só daria com automação de navegador real (fora do
  # escopo, igual LinkedIn). Pra vagas do Meli, buscar direto no site.
  mercadolivre:
    enabled: false

  # Shopee Brasil — API JSON do próprio careers.shopee.com.br (ver
  # collectors/shopee.py). Traz ~500 vagas do Brasil (muitas operacionais),
  # filtradas por title_keywords antes de ir pro Jev. Adicionada em 25/09/2026.
  shopee:
    enabled: true

  # TikTok (São Paulo e Brasília) — API JSON pública do lifeattiktok.com (ver
  # collectors/tiktok.py). Adicionada em 25/09/2026 a pedido do Michel: a
  # exclusão original (ver README) supunha que precisava de navegador, mas a
  # API responde a uma chamada HTTP simples, sem login.
  tiktok:
    enabled: true

  # Workday (myworkdayjobs.com) — ATS de empresas grandes; todo site Workday tem
  # a mesma API pública (ver collectors/workday.py). O coletor fica só com as
  # vagas do Brasil (pelos filtros de localização do próprio site). "url" é a
  # página pública de vagas da empresa. Adicionado em 29/09/2026, a partir do
  # teste com o LinkedIn (vagas de PayPal que o script não via).
  workday:
    enabled: true
    sites:
      - empresa: "PayPal"
        url: "https://paypal.wd1.myworkdayjobs.com/jobs"          # "Sr Analyst, Revenue Operations" SP
      - empresa: "Natura"
        url: "https://natura.wd501.myworkdayjobs.com/NaturaCarreiras"  # CRO E-commerce LATAM, Marketplace
      - empresa: "Rappi"
        url: "https://rappi.wd12.myworkdayjobs.com/Rappi_jobs"   # hoje só vagas operacionais no BR
      - empresa: "Unilever"
        url: "https://unilever.wd3.myworkdayjobs.com/Unilever_Experienced_Professionals"
      - empresa: "Kimberly-Clark"
        url: "https://kimberlyclark.wd1.myworkdayjobs.com/GLOBAL"  # "Especialista em Planejamento de RGM"

  # Teamtailor — cada empresa tem um site de carreiras com feed RSS público em
  # <url>/jobs.rss (ver collectors/teamtailor.py). Adicionado em 29/09/2026,
  # depois que o Jack & Jill achou a vaga de Gerente de E-commerce (Marketplace)
  # da Jet — empresa que não estava no radar. Reconhece-se um site Teamtailor
  # pelos links /jobs.rss e /connect na página de vagas.
  teamtailor:
    enabled: true
    sites:
      - empresa: "Jet Brasil"
        url: "https://careers.jetshr.com.br"   # mobilidade elétrica; "Gerente de E-commerce (Marketplace) e Importação"
      - empresa: "Loft"
        url: "https://loft.teamtailor.com"     # proptech; "Gerente de ... Processos Comerciais | Revenue Operations"

  # SmartRecruiters — API pública oficial (ver collectors/smartrecruiters.py).
  # "id" é o nome que aparece em jobs.smartrecruiters.com/<id>/...
  smartrecruiters:
    enabled: true
    empresas:
      - empresa: "Serasa Experian"
        id: "Experian"        # ~200 vagas no Brasil (29/09/2026)
    max_pages: 2

  # Greenhouse não tem busca entre empresas — cada empresa tem seu "board"
  # (o token que aparece em boards.greenhouse.io/<token>). Liste aqui as
  # empresas que você quer acompanhar; as vagas de cada uma são filtradas
  # pelos search_terms no título.
  # Tokens confirmados em 21/09/2026 (busquei a página de vagas real de cada
  # empresa antes de incluir — nenhum é chute). Empresas do seu pedido que
  # NÃO usam Greenhouse (ficaram de fora): Loft, Mercado Livre/Mercado Pago e
  # Rappi (Workday), BTG Pactual LA/Chile (unidades fora do Brasil).
  #
  # CORREÇÃO (22/09/2026): "abinbev" e "bees" são boards SEPARADOS na
  # Greenhouse — o board "abinbev" NÃO inclui as vagas da BEES (confirmado:
  # um job ID real do board "bees" devolve 404 no board "abinbev"). A nota
  # antiga aqui estava errada. "bees" tem 42 vagas abertas, incluindo Product
  # Strategy Specialist e Strategic Growth Specialist (os processos que o
  # Michel já fez). Achado ao comparar 4 vagas específicas da BEES a pedido
  # dele — ver compare_jobs.py.
  greenhouse:
    enabled: true
    boards:
      - "abinbev"           # AB InBev | Growth Group (fintech/TaDa/Ze Delivery etc.)
      - "bees"              # BEES (B2B commerce da AB InBev) — board próprio, separado do "abinbev"
      - "c6bank"            # C6 Bank
      - "xpinc"             # XP Inc.
      - "hotmartcareersbr"  # Hotmart (Brasil)
      - "hotmartcareersen"  # Hotmart (vagas em inglês/globais)
      - "stone"             # Stone
      - "gympass"           # Wellhub (ex-Gympass)
      - "clara"             # Clara (fintech corporativa, México/LatAm)
      - "btgpactual"        # BTG Pactual
      - "quintoandar"       # QuintoAndar
      - "ifoodcarreiras"    # iFood
      - "nubank"            # Nubank
      - "creditas"          # Creditas
      - "ebanx"             # EBANX
      - "vtex"              # VTEX
      - "rdstation"         # RD Station — tem até vaga de "Revenue Operations" aberta
      - "wildlifestudios"   # Wildlife Studios
      - "pagarme"           # Pagar.me (grupo Stone)
      - "inter"             # 15/10/2026 via /radar — Banco Inter: "Commercial Manager | Inter Shop",
                            # Business Analyst Commercial Planning (InterPag), vagas do Marketplace.
                            # Atenção: a maioria das vagas é em Belo Horizonte (~18 em SP)
      - "arcoeducacao"      # 30/09/2026 via /radar — Arco Educação: "Especialista em Revenue Operations",
                            # Planejamento e Performance Sênior/Coordenação, Analista de Negócios Sênior
      # -- adicionadas em 21/09/2026, rodada de scale-ups/startups --
      - "zenvia"            # Zenvia (CPaaS/martech)
      - "blip-global"       # Take Blip (conversational AI) — tinha vaga de "Revenue Operations"
      - "remotecom"         # Remote.com (RH global, contrata remoto p/ LatAm)
      - "agibank"           # Agibank (banco digital)
      - "jusbrasil"         # Jusbrasil (legaltech)
      - "isaac"             # isaac (fintech de pagamento escolar)
      # -- adicionadas em 21/09/2026, rodada de expansão gringas + startups --
      - "arenaim"           # Arena.im (EUA, plataforma de engajamento/comunidade) — tinha vaga de BDR Brasil remoto
      - "kunumi"             # Kunumi (IA/data) — tinha vaga de "AI Strategist – Operações"
      - "zupinnovation"      # Zup Innovation (grupo Itaú, consultoria/tech) — atividade confirmada, maioria eng.
      - "arcoeducacao"       # Arco Educação (edtech) — tinha vaga de Inteligência Comercial
